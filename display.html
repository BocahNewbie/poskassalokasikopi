<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Layar Antrean - Lokasi Kopi</title>
  <link rel="stylesheet" href="Style.css">
  <style>
    body { background: #2c1e1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .display-box { text-align: center; background: #3e2723; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 600px; }
    .queue-number { font-size: 5em; color: #ffb74d; font-weight: bold; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="display-box">
    <h2>☕ ANTREAN PESANAN LOKASI KOPI</h2>
    <div class="queue-number" id="displayQueue">A-000</div>
    <p id="displayStatus" style="font-size: 1.2em; color: #d7ccc8;">Silakan menunggu panggilan barista</p>
  </div>
</body>
</html>
