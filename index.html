<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOKASI KOPI - Sistem Kasir & Barista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR UTAMA -->
    <div id="navbar" class="navbar" style="display: none;">
        <div class="brand">LOKASI KOPI SYSTEM</div>
        <div class="nav-links">
            <span id="userInfo" style="font-weight: 600; margin-right: 15px;"></span>
            <button class="btn-secondary" onclick="openChangePasswordModal()" style="font-size: 0.85em; padding: 6px 12px;">Ganti Pass</button>
            <button class="btn-danger" onclick="logout()" style="font-size: 0.85em; padding: 6px 12px;">Logout</button>
        </div>
    </div>

    <!-- MODAL GANTI PASSWORD MANDIRI -->
    <div id="changePasswordModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>Ganti Password Akun</h3>
            <p style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 15px;">Silakan masukkan password lama dan password baru Anda.</p>
            <div class="form-group">
                <label>Password Lama</label>
                <input type="password" id="oldPassInput" placeholder="Masukkan password lama">
            </div>
            <div class="form-group">
                <label>Password Baru</label>
                <input type="password" id="newPassInput" placeholder="Minimal 4 karakter">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password Baru</label>
                <input type="password" id="confirmPassInput" placeholder="Ulangi password baru">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-secondary" style="flex: 1;" onclick="closeChangePasswordModal()">Batal</button>
                <button class="btn-primary" style="flex: 1;" onclick="submitChangePassword()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- PANGGILAN SCRIPT MODULAR -->
    <script src="user.js"></script>
    <script src="menu.js"></script>
    <script src="recipe.js"></script>
    <script src="stock.js"></script>
    <script src="script.js"></script>
</body>
</html>
