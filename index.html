<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOKASI KOPI - Sistem Kasir Terpadu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="login-page" class="login-container">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <span style="font-size: 2.8em;">☕</span>
                <h3 style="margin-top: 10px; color: var(--text-main);">Lokasi Kopi System</h3>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Masukkan password">
            </div>
            <div id="loginError" class="error-msg" style="display: none;"></div>
            <button class="btn-primary" onclick="doLogin()">Masuk Sistem</button>
        </div>
    </div>

    <!-- NAVBAR UTAMA -->
    <div id="navbar" class="navbar" style="display: none;">
        <div class="brand">☕ LOKASI KOPI DASHBOARD</div>
        <div class="nav-links">
            <span id="userInfo" style="font-weight: 500; margin-right: 15px; color: var(--text-soft);"></span>
            <button class="btn-secondary" onclick="openChangePasswordModal()">Ganti Password</button>
            <button class="btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- CONTAINER KONTROL HALAMAN UTAMA BERDASARKAN ROLE -->
    <div id="kasir-page" class="page-container" style="display: none;"></div>
    <div id="barista-page" class="page-container" style="display: none;"></div>
    <div id="checker-page" class="page-container" style="display: none;"></div>
    <div id="admin-page" class="page-container" style="display: none;"></div>
    <div id="owner-page" class="page-container" style="display: none;"></div>

    <!-- MODAL GANTI PASSWORD -->
    <div id="changePasswordModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>Ganti Password Akun</h3>
            <p style="font-size: 0.9em; color: var(--text-soft); margin-bottom: 15px;">Masukkan password lama dan password baru Anda.</p>
            <div class="form-group">
                <label>Password Lama</label>
                <input type="password" id="oldPassInput" placeholder="Password lama">
            </div>
            <div class="form-group">
                <label>Password Baru</label>
                <input type="password" id="newPassInput" placeholder="Minimal 4 karakter">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password Baru</label>
                <input type="password" id="confirmPassInput" placeholder="Ulangi password baru">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-secondary" style="flex: 1;" onclick="closeChangePasswordModal()">Batal</button>
                <button class="btn-primary" style="flex: 1;" onclick="submitChangePassword()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- PEMANGGILAN MODUL SCRIPT -->
    <script src="user.js"></script>
<script src="menu.js"></script>
<script src="stock.js"></script>
<script src="recipe.js"></script>
<script src="kasir.js"></script>
<script src="barista.js"></script>
<script src="checker.js"></script>
<script src="admin.js"></script>
<script src="owner.js"></script>
<script src="script.js"></script>
</body>
</html>
