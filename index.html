<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOKASI KOPI - Sistem Kasir & Barista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="login-page" class="login-container" style="display: flex;">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <span style="font-size: 2.5em;">☕</span>
                <h3 style="margin-top: 10px; color: var(--text-main);">Sistem Kasir Terpadu</h3>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Masukkan password">
            </div>
            <div id="loginError" style="color: var(--danger); font-size: 0.85em; margin-bottom: 15px; display: none;"></div>
            <button class="btn-primary" style="width: 100%; padding: 12px;" onclick="doLogin()">Masuk Sistem</button>
        </div>
    </div>

    <!-- NAVBAR UTAMA (Muncul setelah login) -->
    <div id="navbar" class="navbar" style="display: none;">
        <div class="brand">LOKASI KOPI SYSTEM</div>
        <div class="nav-links">
            <span id="userInfo" style="font-weight: 600; margin-right: 15px;"></span>
            <button class="btn-secondary" onclick="openChangePasswordModal()" style="font-size: 0.85em; padding: 6px 12px;">Ganti Pass</button>
            <button class="btn-danger" onclick="logout()" style="font-size: 0.85em; padding: 6px 12px;">Logout</button>
        </div>
    </div>

    <!-- CONTAINER HALAMAN DASHBOARD -->
    <div id="admin-page" class="page-container" style="display: none;"></div>
    <div id="kasir-page" class="page-container" style="display: none;"></div>
    <div id="barista-page" class="page-container" style="display: none;"></div>

    <!-- MODAL SUKSES LOGIN -->
    <div id="loginSuccessModal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="text-align: center;">
            <h3 style="color: var(--success);">Login Berhasil!</h3>
            <p id="loginWelcomeText" style="margin-top: 10px; color: var(--text-muted);"></p>
        </div>
    </div>

    <!-- MODAL GANTI PASSWORD MANDIRI -->
    <div id="changePasswordModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>Ganti Password Akun</h3>
            <p style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 15px;">Silakan masukkan password lama dan password baru Anda.</p>
            <div class="form-group">
                <label>Password Lama</label>
                <input type="password" id="oldPassInput" placeholder="Masukkan password lama">
            </div>
            <div class="form-group">
                <label>Password Baru</label>
                <input type="password" id="newPassInput" placeholder="Minimal 4 karakter">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password Baru</label>
                <input type="password" id="confirmPassInput" placeholder="Ulangi password baru">
            </div>
